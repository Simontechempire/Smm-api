<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SIMON SMM Campaigns</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <h2>SIMON SMM</h2>
  <button onclick="logout()">Logout</button>
</header>

<nav>
  <a href="/dashboard.html">Dashboard</a>
  <a href="/services.html">Services</a>
  <a href="/orders.html">Orders</a>
  <a href="/settings.html">Settings</a>
</nav>

<main class="container">
  <h1>Campaign Management</h1>

  <section class="panel">
    <h2>Create Campaign</h2>
    <form id="orderForm">
      <select name="serviceId" id="serviceSelect" required>
        <option value="">Select a service</option>
      </select>

      <input name="title" placeholder="Campaign title" required>
      <input name="platform" placeholder="Platform" required>
      <input name="targetUrl" type="url" placeholder="Campaign URL" required>
      <textarea name="notes" placeholder="Campaign instructions"></textarea>

      <button type="submit">Create Campaign</button>
    </form>
  </section>

  <section class="panel">
    <h2>Campaign History</h2>
    <div id="orderList">Loading...</div>
  </section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
